name: Compilation of project with submodules and verification by unit tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  BUILD_TYPE: Debug
  # same nixpkgs as ci/Dockerfile.ci (nixos-25.05)
  NIXPKGS_REV: ac62194c3917d5f474c1a844b6fd6da2db95077d

jobs:
  build:
    # the toolchain comes from shell.nix, exactly like in the forgejo CI image
    # (that image lives in a private registry, so it is not used here)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: false

    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      with:
        nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/${{ env.NIXPKGS_REV }}.tar.gz

    - name: realise build environment
      run: nix-shell --run 'clang --version && cmake --version'

    - name: Update submodules
      run: git submodule update --init

    - name: compute dependencies cache hash
      id: cache_hash
      run: |
        HASH=$(ci/ext-hash.sh)
        echo "hash=$HASH" >> $GITHUB_OUTPUT
        echo "output: hash=$HASH"

    - name: cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ext-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_hash.outputs.hash }}
        path: |
          ext/Linux_*

    - name: Build dependencies
      run: nix-shell --run 'ci/ci.sh deps'

    - name: Build
      run: nix-shell --run 'ci/ci.sh build'

    - name: Test (unit tests, CLI smoke test)
      run: nix-shell --run 'ci/ci.sh test'

    - name: Build and test with ASan/UBSan
      run: nix-shell --run 'ci/ci.sh asan'

    - name: Packaging
      working-directory: ${{github.workspace}}/build
      run: nix-shell ../shell.nix --run cpack
